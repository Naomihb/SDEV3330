name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: TypeScript unit tests + coverage
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:ci
        env:
          # Unit tests don't hit the network but Next.js requires these to not crash
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          ANTHROPIC_API_KEY: placeholder-key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 2: Build check
  # ─────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com

  # ─────────────────────────────────────────────
  # Job 3: Python integration tests
  # Runs only on push to main (not every PR) to
  # avoid hammering the live Supabase instance.
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (pytest)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Python test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Start Next.js server
        run: pnpm start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000 && echo "Server ready" && break
            echo "Waiting... ($i/20)"
            sleep 3
          done

      - name: Run integration tests
        run: |
          cd tests/integration
          pytest -v --tb=short
        env:
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_INSTRUCTOR_EMAIL: ${{ secrets.TEST_INSTRUCTOR_EMAIL }}
          TEST_INSTRUCTOR_PASSWORD: ${{ secrets.TEST_INSTRUCTOR_PASSWORD }}
          TEST_JOIN_CODE: cs3330-f26
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload pytest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: tests/integration/.pytest_cache/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 4: Integration tests against LOCAL Supabase
  # Hermetic: runs on every push/PR, catches schema
  # drift between code and migrations.
  # ─────────────────────────────────────────────
  integration-local:
    name: Integration Tests (local Supabase)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations)
        run: supabase start

      - name: Export Supabase env
        run: |
          supabase status -o env | tee supabase.env
          grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' supabase.env | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Create CI instructor user
        run: |
          curl -sf -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"instructor-ci@test.example","password":"CiInstructor123!","email_confirm":true}'

      - name: Seed course and weeks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/integration/ci_seed.sql

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: placeholder-key

      - name: Start Next.js server
        run: pnpm start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: placeholder-key

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000 >/dev/null && echo "Server ready" && break
            sleep 3
          done

      - name: Install Python test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run integration tests
        run: |
          cd tests/integration
          pytest -v --tb=short
        env:
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          TEST_STUDENT_EMAIL: integration-student@test.example
          TEST_STUDENT_PASSWORD: IntegrationTest123!
          TEST_INSTRUCTOR_EMAIL: instructor-ci@test.example
          TEST_INSTRUCTOR_PASSWORD: CiInstructor123!
          TEST_JOIN_CODE: cs3330-f26
